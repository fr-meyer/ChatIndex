schema_version: 0.1
id: pr-018-openai-compatible-provider-routing
title: OpenAI-compatible provider routing for tree build and retrieval
branch: feat/openai-compatible-provider-routing
base_branch: dev
status: in_review
pret_a_coder: retroactive_process_repair
objective: >
  Fix the provider-flexibility gap left after PR001 by allowing both CTree
  tree-building and retrieval to route through OpenAI-compatible endpoints such
  as LiteLLM, DashScope/Qwen compatible mode, vLLM, or another gateway, while
  keeping existing OpenAI and Anthropic retrieval behavior compatible.
acceptance_criteria:
  - CTree accepts an optional OpenAI-compatible base URL for build and load flows.
  - Low-level OpenAI SDK calls use the configured compatible endpoint when provided.
  - Retrieval provider configuration preserves and applies an OpenAI-compatible base URL.
  - Public call sites remain backward-compatible for existing credential keyword usage.
  - Tests cover explicit and environment-derived compatible endpoint routing without live provider calls.
  - Classification accepts compatible-provider JSON where `new_topic_parent_index` is `null` or otherwise non-numeric.
  - README documents compatible endpoint usage, including a Qwen-style route.
  - README documents slice-first validation for slower compatible providers or large histories.
  - OpenClaw dogfood wrapper can build and query with configurable provider, model, credential environment variable, and compatible endpoint.
  - Local unit tests, syntax checks, YAML checks, git diff check, and Speculoos validation pass before PR publication.
process_note: >
  This task file was created after the initial local implementation because the
  provider gap was discovered during dogfood planning and was patched too
  quickly. The correction is to attach the already-local diff to this Speculoos
  task before any PR, merge, or external surface publication.

schema_version: 0.1
id: pr-020-status-freshness-warning
title: Status freshness warning hardening
branch: feat/status-freshness-warning
base_branch: dev
status: closed
pret_a_coder: satisfied
objective: >
  Broaden retrieval freshness warnings so stale indexed slices are flagged when
  users ask workflow-status questions such as what remains, what is left, next
  steps, or current status.
acceptance_criteria:
  - Freshness warnings trigger for status wording including `what remains`,
    `what is left`, `next steps`, and `current status`.
  - Non-status uses of words such as `remaining budget` do not warn just because
    they contain a temporal-looking word.
  - README documents status-sensitive freshness warnings.
  - Speculoos closeout guidance records the metadata-only PR reviewer/CI note
    rule.
  - Focused and full tests pass before publication.
  - One bounded non-production Qwen dogfood query confirms `what remains now`
    returns a freshness warning.
write_scope:
  allowed:
    - README.md
    - retrieval/llm_tools.py
    - tests/test_retrieval_llm.py
    - .speculoos/README.md
    - .speculoos/tasks/pr-020-status-freshness-warning.yaml
    - .speculoos/manifest.yaml
    - .speculoos/surfaces/github.yaml
    - .speculoos/surfaces/vibe-kanban.yaml
  forbidden:
    - .env
    - .env.*
    - .venv/**
    - .agents/**
    - .speculoos/runs/**
    - .openclaw/**
    - openclaw-logs/**
    - openclaw-sessions/**
    - logs/**
    - sessions/**
    - tmp/**
    - tmp/speculoos/**
    - secrets/**
    - .secrets/**
    - "*.key"
    - "*.pem"
    - "*.index"
    - "*.faiss"

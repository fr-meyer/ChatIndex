base_branch: dev
status: in_progress
pret_a_coder: satisfied
objective: >
  Document that CodeRabbit can skip automatic review on PRs targeting the fork
  dev branch, so CI and manual Speculoos validation remain the required gate
  unless CodeRabbit review is explicitly triggered or repository settings are
  changed.
acceptance_criteria:
  - .speculoos/README.md documents the CodeRabbit dev-target caveat.
  - Repo-local Speculoos metadata records PR012 surfaces and validation evidence.
  - The task remains docs/metadata-only.
  - release-plan is not run because there is no promotion, tag, or GitHub Release.

objective: >
  Optimize incremental offline CTree construction by limiting overflow
  reorganization checks to the changed topic path while preserving current
  public call shapes and no-key testability.
acceptance_criteria:
  - Existing no-key tests still pass.
  - New tests cover path-local overflow checks and parent rechecks without live provider API calls.
  - "`CTree.add()` no longer scans the full tree after each added exchange."

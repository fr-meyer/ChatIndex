schema_version: 0.1
id: pr-013-pullfrog-review-workflow
title: Pilot self-managed Pullfrog review workflow
branch: speculoos/pr-013-pullfrog-review-workflow
base_branch: dev
status: in_progress
pret_a_coder: satisfied
objective: >
  Add a manual, review-only Pullfrog workflow that can pilot self-managed
  PR review for ChatIndex dev-targeted pull requests without depending on
  Pullfrog hosted premium per-run billing.
acceptance_criteria:
  - .github/workflows/pullfrog-review.yml defines a workflow_dispatch manual review path with a required PR number input.
  - The workflow uses upstream Pullfrog unchanged, pinned by reviewed commit.
  - The workflow passes GH_TOKEN, BYOK provider secrets, and an explicit model input.
  - The workflow defaults API_URL to localhost to test the no-hosted-API path.
  - The workflow sets push disabled and does not auto-fix, auto-merge, or write protected branches.
  - Repo-local Speculoos metadata records PR013 surfaces and validation evidence.
  - The first live review test is recorded as a follow-up if it needs a tiny post-merge PR.
write_scope:
  allowed:
    - .github/workflows/pullfrog-review.yml
    - .speculoos/README.md
    - .speculoos/manifest.yaml
    - .speculoos/tasks/pr-013-pullfrog-review-workflow.yaml
    - .speculoos/surfaces/github.yaml
    - .speculoos/surfaces/vibe-kanban.yaml
  forbidden:
    - .env
    - .env.*
    - .venv/**
    - .agents/**
    - .speculoos/runs/**
    - .openclaw/**
    - openclaw-logs/**
    - openclaw-sessions/**
    - logs/**
    - sessions/**
    - tmp/**
    - tmp/speculoos/**
    - secrets/**
    - .secrets/**
    - "*.key"
    - "*.pem"
    - "*.index"
    - "*.faiss"
